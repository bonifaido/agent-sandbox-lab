name: windows-sandboxes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows.yml']

permissions:
  contents: read

jobs:
  codex:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Codex CLI
        shell: pwsh
        run: npm install -g @openai/codex
      - name: Run the checks plain and under each Codex sandbox mode
        shell: pwsh
        run: ./windows/run.ps1 -OutDir results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-windows
          path: results
